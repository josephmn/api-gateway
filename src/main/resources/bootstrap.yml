spring:
  application:
    name: api-gateway
    version: "@project.version@"
  banner:
    location: classpath:banner/banner-${SPRING_PROFILES_ACTIVE:dev}.txt
  cloud:
    config:
      uri: ${CONFIG_SERVER:http://localhost:8888}
      fail-fast: true
    vault:
      enabled: true
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: http
      authentication: TOKEN # Tipo de autenticación que usarás (token, AppRole, etc.)
      token: 00000000-0000-0000-0000-000000000000 # Reemplaza con tu token de root
      kv:
        enabled: true
        backend: secret # El nombre de tu backend de secretos
  output:
    ansi:
      enabled: ALWAYS
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}  # URL del Discovery Server
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    lease-expiration-duration-in-seconds: 5
    lease-renewal-interval-in-seconds: 3
management:
  endpoints:
    web:
      exposure:
        include: refresh, bus-refresh, health, info, metrics
  endpoint:
    health:
      show-details: always
  security:
    enabled: false # Deshabilitar seguridad en endpoints de management

