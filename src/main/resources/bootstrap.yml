#server:
#  port: 8090
spring:
  application:
    name: api-gateway
    version: "@project.version@"
  profiles:
    active: prod
  cloud:
    config:
      uri: ${CONFIG_SERVER:http://localhost:8888}
      fail-fast: true
  output:
    ansi:
      enabled: ALWAYS
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
# Configuración de Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /index.html
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
        primaryName: API Gateway
# Configuración JWT
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas en milisegundos
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}  # URL del Discovery Server
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    lease-expiration-duration-in-seconds: 5
    lease-renewal-interval-in-seconds: 3
management:
  endpoints:
    web:
      exposure:
        include: refresh, bus-refresh, health, info, metrics
  endpoint:
    health:
      show-details: always
  security:
    enabled: false # Deshabilitar seguridad en endpoints de management