spring:
  application:
    name: api-gateway
    version: "@project.version@"
  banner:
    location: classpath:banner/banner-${SPRING_PROFILES_ACTIVE:dev}.txt
  cloud:
    config:
      uri: ${CONFIG_SERVER:http://localhost:8888}
      fail-fast: true
    vault:
      enabled: true
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: http
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
  output:
    ansi:
      enabled: ALWAYS
db:
  host: db_postgres
  port: 5432
  database: gateway
  username: postgres
  password: Sgr9cl4v3s
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}  # URL del Discovery Server
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    lease-expiration-duration-in-seconds: 5
    lease-renewal-interval-in-seconds: 3
management:
  endpoints:
    web:
      exposure:
        include: refresh, bus-refresh, health, info, metrics, gateway, openapi
  endpoint:
    health:
      show-details: always
  security:
    enabled: false # Deshabilitar seguridad en endpoints de management

